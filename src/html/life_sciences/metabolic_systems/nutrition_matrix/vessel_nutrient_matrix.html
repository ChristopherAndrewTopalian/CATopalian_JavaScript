<!DOCTYPE html>
<html lang="en">
<head>
<title> Vessel Nutrient Matrix </title>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body
{
    background-color: rgb(10, 10, 15);
    color: rgb(0, 255, 255);
    font-family: Arial;
    margin: 0px;
    padding: 0px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1
{
    text-transform: uppercase;
    letter-spacing: 3px;
    border-bottom: 2px solid rgb(0, 150, 150);
    padding-bottom: 0px;
    text-align: center;
    font-size: 20px;
}

.interface-container
{
    display: flex;
    width: 100%;
    max-width: 1000px;
    gap: 10px;
    margin-top: 0px;
}

.panel
{
    background-color: rgb(15, 15, 20);
    border: 1px solid rgb(0, 150, 150);
    border-radius: 8px;
    padding: 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.panel-title
{
    font-weight: bold;
    text-align: center;
    border-bottom: 1px solid rgb(0, 100, 100);
    padding-bottom: 5px;
    margin-bottom: 15px;
    color: rgb(150, 255, 255);
}

.slider-group
{
    margin-bottom: 15px;
}

label
{
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 5px;
}

input[type=range] {
    width: 100%;
    cursor: pointer;
}

.canvas-container {
    flex: 2;
    background-color: rgb(5, 5, 8);
    border: 1px solid rgb(50, 100, 100);
    border-radius: 8px;
    position: relative;
}

canvas
{
    width: 100%;
    height: 100%;
    display: block;
    min-height: 400px;
}

.status-item
{
    margin-bottom: 15px;
    padding: 10px;
    background-color: rgb(20, 20, 25);
    border-left: 4px solid rgb(0, 255, 255);
}

.status-name
{
    font-size: 12px;
    color: rgb(150, 150, 150);
    text-transform: uppercase;
}

.status-readout
{
    font-size: 16px;
    font-weight: bold;
    margin-top: 5px;
    transition: color 0.3s;
}

.warning-text
{
    color: rgb(255, 50, 50) !important;
}

.caution-text
{
    color: rgb(255, 200, 0) !important;
}

.optimal-text
{
    color: rgb(0, 255, 255) !important;
}

</style>

</head>

<body>

    <h1>Vessel Nutrient Matrix</h1>

    <div class="interface-container">
        
        <div class="panel">
            <div class="panel-title">MATERIAL INPUTS (DAILY)</div>
            
            <div class="slider-group">
                <label><span>Calcium (Hull Frame)</span> <span id="valCalc">1000 mg</span></label>
                <input type="range" id="slCalc" min="0" max="1500" value="1000">
            </div>
            <div class="slider-group">
                <label><span>Vitamin C (Catalyst)</span> <span id="valVitC">90 mg</span></label>
                <input type="range" id="slVitC" min="0" max="200" value="90">
            </div>
            <div class="slider-group">
                <label><span>Vitamin A (Turnover)</span> <span id="valVitA">900 mcg</span></label>
                <input type="range" id="slVitA" min="0" max="1500" value="900">
            </div>
            <div class="slider-group">
                <label><span>Dietary Fiber (Filtration)</span> <span id="valFiber">30 g</span></label>
                <input type="range" id="slFiber" min="0" max="50" value="30">
            </div>
            <div class="slider-group">
                <label><span>Vitamin B12 (Mainframe)</span> <span id="valB12">2.4 mcg</span></label>
                <input type="range" id="slB12" min="0" max="5" step="0.1" value="2.4">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="vesselCanvas"></canvas>
        </div>

        <div class="panel">
            <div class="panel-title">SYSTEM STATUS</div>
            
            <div class="status-item" id="boxHull">
                <div class="status-name">Structural Scaffolding (Bones & Skin)</div>
                <div class="status-readout optimal-text" id="outHull">OPTIMAL: Density Maintained</div>
            </div>
            
            <div class="status-item" id="boxFilter">
                <div class="status-name">Filtration Array (Intestines)</div>
                <div class="status-readout optimal-text" id="outFilter">OPTIMAL: Waste Ejection Active</div>
            </div>
            
            <div class="status-item" id="boxNeural">
                <div class="status-name">Mainframe Grid (Neurology)</div>
                <div class="status-readout optimal-text" id="outNeural">OPTIMAL: Myelin Intact</div>
            </div>
        </div>

    </div>

    <script>

        let canvas = document.getElementById("vesselCanvas");
        let ctx = canvas.getContext("2d");
        
        let sliders = {
            calc: document.getElementById("slCalc"),
            vitc: document.getElementById("slVitC"),
            vita: document.getElementById("slVitA"),
            fiber: document.getElementById("slFiber"),
            b12: document.getElementById("slB12")
        };
        
        let readouts = {
            calc: document.getElementById("valCalc"),
            vitc: document.getElementById("valVitC"),
            vita: document.getElementById("valVitA"),
            fiber: document.getElementById("valFiber"),
            b12: document.getElementById("valB12")
        };

        let statusOuts = {
            hull: document.getElementById("outHull"),
            filter: document.getElementById("outFilter"),
            neural: document.getElementById("outNeural")
        };

        let boxes = {
            hull: document.getElementById("boxHull"),
            filter: document.getElementById("boxFilter"),
            neural: document.getElementById("boxNeural")
        };

        // Canvas Setup
        let cw, ch;
        function resizeCanvas()
        {
            let rect = canvas.parentElement.getBoundingClientRect();
            let dpr = window.devicePixelRatio || 1; // Ask the monitor for its hardware density

            // Multiply the internal memory of the canvas to match the hardware
            canvas.width = rect.width * dpr;
            canvas.height = (rect.height || 400) * dpr;

            // Force the CSS to keep the physical box the same size
            canvas.style.width = rect.width + "px";
            canvas.style.height = (rect.height || 400) + "px";

            // Scale the drawing context so our math still works perfectly
            ctx.scale(dpr, dpr);

            // Keep our logical variables standard for drawing
            cw = rect.width;
            ch = rect.height || 400;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Animation Variables
        let time = 0;

        // Input Listener Setup
        function updateLabels()
        {
            readouts.calc.innerText = sliders.calc.value + " mg";
            readouts.vitc.innerText = sliders.vitc.value + " mg";
            readouts.vita.innerText = sliders.vita.value + " mcg";
            readouts.fiber.innerText = sliders.fiber.value + " g";
            readouts.b12.innerText = sliders.b12.value + " mcg";
        }

        for (let key in sliders)
        {
            sliders[key].addEventListener('input', updateLabels);
        }

        // Helper to set UI classes
        function setStatus(element, box, state, text)
        {
            element.innerText = text;
            element.className = "status-readout"; // Reset

            if (state === 'optimal')
            {
                element.classList.add("optimal-text");
                box.style.borderLeftColor = "rgb(0, 255, 255)";
            }
            else if (state === 'caution')
            {
                element.classList.add("caution-text");
                box.style.borderLeftColor = "rgb(255, 200, 0)";
            }
            else
            {
                element.classList.add("warning-text");
                box.style.borderLeftColor = "rgb(255, 50, 50)";
            }
        }

        // Main Render Loop
        function render()
        {
            ctx.clearRect(0, 0, cw, ch);
            time += 0.05;

            let cx = cw / 2;
            let cy = ch / 2;

            // Get Current Values
            let valCalc = parseInt(sliders.calc.value);
            let valVitC = parseInt(sliders.vitc.value);
            let valVitA = parseInt(sliders.vita.value);
            let valFiber = parseInt(sliders.fiber.value);
            let valB12 = parseFloat(sliders.b12.value);

            // Determine System States
            let hullState = 'optimal';
            if (valCalc < 500 || valVitC < 30) hullState = 'danger';
            else if (valCalc < 800 || valVitC < 60 || valVitA < 500) hullState = 'caution';

            let filterState = 'optimal';
            if (valFiber < 10) filterState = 'danger';
            else if (valFiber < 20) filterState = 'caution';

            let neuralState = 'optimal';
            if (valB12 < 1.0) neuralState = 'danger';
            else if (valB12 < 2.0) neuralState = 'caution';

            // --- DRAWING THE VESSEL ---

            // Skin/Hull (Reacts to Vit C & Vit A)
            let skinColor = "rgba(0, 150, 150, 0.3)";
            let pulse = Math.abs(Math.sin(time * 2)) * 0.5;
            
            if (valVitC < 40 || valVitA < 400) {
                skinColor = "rgba(255, 200, 0, " + (0.3 + pulse) + ")"; // Yellow warning (Collagen/Turnover loss)
            }

            ctx.beginPath();
            // Stylized head and torso outline
            ctx.arc(cx, cy - 100, 40, Math.PI, 0); // Top head
            ctx.lineTo(cx + 40, cy - 60); // Right face
            ctx.lineTo(cx + 20, cy - 30); // Right neck
            ctx.lineTo(cx + 70, cy - 10); // Right shoulder
            ctx.lineTo(cx + 70, cy + 150); // Right torso
            ctx.lineTo(cx - 70, cy + 150); // Left torso
            ctx.lineTo(cx - 70, cy - 10); // Left shoulder
            ctx.lineTo(cx - 20, cy - 30); // Left neck
            ctx.lineTo(cx - 40, cy - 60); // Left face
            ctx.closePath();

            ctx.strokeStyle = skinColor;
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.fillStyle = "rgba(5, 5, 10, 0.8)";
            ctx.fill();

            // Skeleton (Reacts to Calcium)
            let boneColor = "rgb(200, 255, 255)";
            if (valCalc < 500)
            {
                boneColor = (Math.sin(time * 5) > 0) ? "rgb(255, 50, 50)" : "rgb(100, 0, 0)"; // Flashing Red
            }
            else if (valCalc < 800)
            {
                boneColor = "rgb(255, 200, 0)";
            }

            ctx.strokeStyle = boneColor;
            ctx.lineWidth = 3;
            // Ribs
            for (let i = 0; i < 5; i++)
            {
                ctx.beginPath();
                ctx.moveTo(cx, cy - 10 + (i * 20));
                ctx.quadraticCurveTo(cx + 50, cy - 10 + (i * 20), cx + 40, cy + 10 + (i * 20));
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(cx, cy - 10 + (i * 20));
                ctx.quadraticCurveTo(cx - 50, cy - 10 + (i * 20), cx - 40, cy + 10 + (i * 20));
                ctx.stroke();
            }

            // Filtration Array / Intestines (Reacts to Fiber)
            let filterColor = "rgba(0, 200, 100, 0.7)";

            if (valFiber < 10)
            {
                filterColor = "rgba(255, 50, 50, " + (0.5 + Math.abs(Math.sin(time * 4)) * 0.5) + ")"; // Pulsing Red
            }

            ctx.strokeStyle = filterColor;
            ctx.lineWidth = 8;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            // Abstract squiggly path
            ctx.moveTo(cx + 20, cy + 100);
            ctx.lineTo(cx - 30, cy + 110);
            ctx.lineTo(cx + 40, cy + 120);
            ctx.lineTo(cx - 20, cy + 130);
            ctx.lineTo(cx + 10, cy + 140);
            ctx.stroke();

            // Mainframe Grid / Neurology (Reacts to B12)
            let neuralColor = "rgb(0, 255, 255)";
            let xOffset = 0;
            
            if (valB12 < 1.0)
            {
                neuralColor = "rgb(255, 100, 100)";
                // Simulate electrical misfire/jitter
                xOffset = (Math.random() - 0.5) * 8; 
            }
            else if (valB12 < 2.0)
            {
                neuralColor = "rgb(255, 200, 0)";
                xOffset = (Math.random() - 0.5) * 2;
            }

            ctx.strokeStyle = neuralColor;
            ctx.fillStyle = neuralColor;
            ctx.lineWidth = 2;
            
            // Brain
            ctx.beginPath();
            ctx.arc(cx + xOffset, cy - 100, 25, 0, Math.PI * 2);
            ctx.fill();

            // Spinal Cord
            ctx.beginPath();
            ctx.moveTo(cx + xOffset, cy - 75);
            ctx.lineTo(cx + xOffset, cy + 80);
            ctx.stroke();

            // UPDATE TEXT READOUTS

            if (hullState === 'optimal')
            {
                setStatus(statusOuts.hull, boxes.hull, 'optimal', "OPTIMAL: Density & Elasticity Maintained");
            }
            else if (hullState === 'caution')
            {
                setStatus(statusOuts.hull, boxes.hull, 'caution', "CAUTION: Material Shortage Detected");
            }
            else
            {
                setStatus(statusOuts.hull, boxes.hull, 'danger', "CRITICAL: Structural Deterioration (Thinning/Decay)");
            }

            if (filterState === 'optimal')
            {
                setStatus(statusOuts.filter, boxes.filter, 'optimal', "OPTIMAL: Waste Ejection Online");
            }
            else if (filterState === 'caution')
            {
                setStatus(statusOuts.filter, boxes.filter, 'caution', "CAUTION: Sludge Buildup in Array");
            }
            else
            {
                setStatus(statusOuts.filter, boxes.filter, 'danger', "CRITICAL: Filtration Stalled (Toxicity Warning)");
            }

            if (neuralState === 'optimal')
            {
                setStatus(statusOuts.neural, boxes.neural, 'optimal', "OPTIMAL: Myelin Sheath Intact");
            }
            else if (neuralState === 'caution')
            {
                setStatus(statusOuts.neural, boxes.neural, 'caution', "CAUTION: Transmission Delay Detected");
            }
            else
            {
                setStatus(statusOuts.neural, boxes.neural, 'danger', "CRITICAL: Axon Short-Circuit (Neuropathy Danger)");
            }

            requestAnimationFrame(render);
        }

        // Kick off loop
        render();

    </script>

</body>

</html>
