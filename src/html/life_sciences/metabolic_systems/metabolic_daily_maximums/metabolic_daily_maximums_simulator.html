<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Metabolic Daily Maximums Simulator</title>
    <style>
        body {
            background-color: rgb(15, 15, 20);
            color: rgb(0, 255, 255);
            font-family: Arial, sans-serif;
            margin: 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid rgb(0, 150, 150);
            padding-bottom: 4px;
            margin: 10px 0px;
            text-align: center;
        }
        .warning-text {
            color: rgb(255, 100, 100);
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
            max-width: 600px;
        }
        .control-panel {
            background-color: rgb(25, 25, 30);
            border: 1px solid rgb(0, 150, 150);
            padding: 10px;
            border-radius: 8px;
            width: 95%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-row {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        button {
            background-color: rgb(0, 100, 100);
            color: white;
            border: 1px solid rgb(0, 200, 200);
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            flex-grow: 1;
            font-size: 12px;
            transition: 0.2s;
        }
        button:hover { background-color: rgb(0, 150, 150); }
        .danger-btn { background-color: rgb(120, 30, 30); border-color: rgb(255, 50, 50); }
        .danger-btn:hover { background-color: rgb(180, 40, 40); }
        
        #canvasContainer {
            margin-top: 15px;
            width: 95%;
            max-width: 600px;
            height: 400px;
            border: 1px solid rgb(70, 70, 90);
            background-color: rgb(5, 5, 8);
            position: relative;
            border-radius: 4px;
        }
        canvas { width: 100%; height: 100%; display: block; }
        
        .readout {
            display: flex;
            justify-content: space-between;
            width: 95%;
            max-width: 600px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Daily Bandwidth Tank</h1>
    <div class="warning-text">
        AHA MAXIMUM LIMIT: ~36g (Men) / 25g (Women)<br>
        Exceeding this bandwidth forces the liver to convert excess into triglycerides.
    </div>

    <div class="control-panel">
        <div class="btn-row">
            <button onclick="addPayload('broccoli')">Broccoli (2g)</button>
            <button onclick="addPayload('potato')">Baked Potato (4g)</button>
        </div>
        <div class="btn-row">
            <button class="danger-btn" onclick="addPayload('juice')">Orange Juice (33g)</button>
            <button class="danger-btn" onclick="addPayload('soda')">Can of Soda (39g)</button>
            <button class="danger-btn" onclick="addPayload('honeyPB')">Honey + PB (45g)</button>
        </div>
        <button onclick="resetTank()" style="background-color: #333; border-color: #555;">Reset Day</button>
    </div>

    <div id="canvasContainer">
        <canvas id="tankCanvas"></canvas>
    </div>

    <div class="readout">
        <div>Total Loaded: <span id="totalText" style="color: rgb(0, 255, 255);">0g</span></div>
        <div id="statusText" style="color: rgb(0, 255, 150);">NOMINAL</div>
    </div>

    <script>
        let canvas = document.getElementById("tankCanvas");
        let ctx = canvas.getContext("2d");
        let totalText = document.getElementById("totalText");
        let statusText = document.getElementById("statusText");

        let cw, ch;
        let currentGrams = 0;
        let targetGrams = 0;
        let maxLimit = 36; // Using 36 as the visual redline

        let payloads = {
            'broccoli': 2,
            'potato': 4,
            'juice': 33,
            'soda': 39,
            'honeyPB': 45
        };

        let spills = []; // Array to hold overflowing fat blocks

        function setupCanvas() {
            let rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            cw = rect.width;
            ch = rect.height;
        }

        function addPayload(type) {
            targetGrams += payloads[type];
        }

        function resetTank() {
            targetGrams = 0;
            currentGrams = 0;
            spills = [];
            totalText.innerText = "0g";
            statusText.innerText = "NOMINAL";
            statusText.style.color = "rgb(0, 255, 150)";
        }

        function drawTank() {
            let tankWidth = 150;
            let tankHeight = ch * 0.8;
            let tankX = (cw / 2) - (tankWidth / 2);
            let tankY = ch * 0.1;

            // Draw Tank Outline
            ctx.strokeStyle = "rgba(0, 200, 200, 0.5)";
            ctx.lineWidth = 4;
            ctx.strokeRect(tankX, tankY, tankWidth, tankHeight);

            // Calculate Fill Level (Scale to maxLimit = 80% of tank height)
            let pixelsPerGram = (tankHeight * 0.8) / maxLimit; 
            let fillHeight = currentGrams * pixelsPerGram;
            
            // Draw Liquid Fill
            let isOverload = currentGrams > maxLimit;
            ctx.fillStyle = isOverload ? "rgba(255, 50, 50, 0.8)" : "rgba(0, 255, 255, 0.6)";
            
            // Cap the liquid inside the tank visually
            let visualFill = Math.min(fillHeight, tankHeight);
            ctx.fillRect(tankX, tankY + tankHeight - visualFill, tankWidth, visualFill);

            // Draw AHA Limit Line
            let limitY = tankY + tankHeight - (maxLimit * pixelsPerGram);
            ctx.strokeStyle = "rgb(255, 0, 0)";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(tankX - 20, limitY);
            ctx.lineTo(tankX + tankWidth + 20, limitY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = "rgb(255, 100, 100)";
            ctx.font = "12px Arial";
            ctx.fillText("AHA MAX LIMIT (36g)", tankX + tankWidth + 25, limitY + 4);

            // Handle Overflow Spill Mechanics
            if (currentGrams > maxLimit && Math.random() > 0.8) {
                spills.push({
                    x: tankX + (Math.random() * tankWidth),
                    y: tankY,
                    speed: Math.random() * 2 + 1
                });
            }

            // Draw Spilled Fat
            ctx.fillStyle = "rgba(255, 200, 0, 0.9)"; // Yellow fat blocks
            for (let i = 0; i < spills.length; i++) {
                spills[i].y += spills[i].speed;
                ctx.fillRect(spills[i].x, spills[i].y, 8, 8);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, cw, ch);

            // Smoothly animate the liquid rising
            if (currentGrams < targetGrams) {
                currentGrams += 0.5;
            }

            drawTank();

            // Update Text
            totalText.innerText = Math.floor(currentGrams) + "g";
            if (currentGrams > maxLimit) {
                statusText.innerText = "SYSTEM OVERLOAD: FAT STORAGE ACTIVE";
                statusText.style.color = "rgb(255, 50, 50)";
            }

            requestAnimationFrame(animate);
        }

        setupCanvas();
        animate();
        window.addEventListener("resize", setupCanvas);
    </script>
</body>
</html>
