<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Serving Size Illusion</title>
    <style>
        body {
            background-color: rgb(15, 15, 20);
            color: rgb(0, 255, 255);
            font-family: Arial, sans-serif;
            margin: 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid rgb(0, 150, 150);
            padding-bottom: 4px;
            margin: 10px 0px;
            text-align: center;
        }
        .description {
            color: rgb(200, 200, 200);
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            max-width: 600px;
            line-height: 1.4;
        }
        .highlight { color: rgb(255, 100, 100); font-weight: bold; }
        
        .control-panel {
            background-color: rgb(25, 25, 30);
            border: 1px solid rgb(0, 150, 150);
            padding: 10px;
            border-radius: 8px;
            width: 95%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-row {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        button {
            background-color: rgb(0, 100, 100);
            color: white;
            border: 1px solid rgb(0, 200, 200);
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            flex-grow: 1;
            font-size: 12px;
            transition: 0.2s;
        }
        button:hover { background-color: rgb(0, 150, 150); }
        .danger-btn { background-color: rgb(120, 30, 30); border-color: rgb(255, 50, 50); }
        .danger-btn:hover { background-color: rgb(180, 40, 40); }
        .share-btn { background-color: rgb(50, 100, 200); border-color: rgb(100, 150, 255); }
        .share-btn:hover { background-color: rgb(70, 120, 220); }

        .battery-container {
            display: flex;
            justify-content: space-between;
            width: 95%;
            max-width: 600px;
            margin-top: 20px;
            gap: 10px;
        }
        .meal-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
        }
        .meal-title {
            font-size: 14px;
            margin-bottom: 5px;
            color: rgb(0, 255, 150);
        }
        .battery {
            width: 100%;
            height: 250px;
            border: 2px solid rgb(100, 100, 120);
            background-color: rgb(10, 10, 15);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .fill {
            width: 100%;
            height: 0%;
            background-color: rgb(0, 200, 200);
            transition: height 0.5s ease-in-out, background-color 0.5s ease-in-out;
        }
        .limit-line {
            position: absolute;
            bottom: 100%; /* 12g is the max visual height of the healthy zone */
            width: 100%;
            border-top: 2px dashed rgb(255, 50, 50);
        }
        .readout {
            margin-top: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        .system-status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            height: 24px;
        }
        hr
        {
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>The Serving Size Illusion</h1>
    <div class="description">
        If our AHA daily maximum is 36g, our liver can only safely process <span class="highlight">12g of added sugar per meal</span>. Watch how a single liquid "serving" destroys our bandwidth for the entire day.
    </div>

    <div class="control-panel">
        <div class="btn-row">
            <button onclick="consume(22)">8oz Orange Juice (22g)</button>
            <button onclick="consume(24)">8oz Apple Juice (24g)</button>
        </div>
        <div class="btn-row">
            <button class="danger-btn" onclick="consume(39)">12oz Soda (39g)</button>
            <button class="danger-btn" onclick="consume(17)">1 Tbsp Honey (17g)</button>
        </div>
        <div class="btn-row">
            <button onclick="resetSystem()" style="background-color: #333; border-color: #555;">Reset Day</button>
        </div>
    </div>

    <div class="battery-container">
        <div class="meal-col">
            <div class="meal-title">BREAKFAST (12g)</div>
            <div class="battery">
                <div class="limit-line"></div>
                <div id="fill-0" class="fill"></div>
            </div>
            <div id="readout-0" class="readout">0g</div>
        </div>
        <div class="meal-col">
            <div class="meal-title">LUNCH (12g)</div>
            <div class="battery">
                <div class="limit-line"></div>
                <div id="fill-1" class="fill"></div>
            </div>
            <div id="readout-1" class="readout">0g</div>
        </div>
        <div class="meal-col">
            <div class="meal-title">DINNER (12g)</div>
            <div class="battery">
                <div class="limit-line"></div>
                <div id="fill-2" class="fill"></div>
            </div>
            <div id="readout-2" class="readout">0g</div>
        </div>
    </div>

    <div id="systemStatus" class="system-status" style="color: rgb(0, 255, 150);">ALL SYSTEMS NOMINAL</div>

    <hr>

    <button class="share-btn" onclick="copyDirectLink()">Copy Direct Link</button>

    <script>
        let totalConsumed = 0;
        const MEAL_LIMIT = 12; // 12g per meal (36g total daily)

        function consume(grams) {
            totalConsumed += grams;
            updateBatteries();
        }

        function resetSystem() {
            totalConsumed = 0;
            updateBatteries();
            document.getElementById('systemStatus').innerText = "ALL SYSTEMS NOMINAL";
            document.getElementById('systemStatus').style.color = "rgb(0, 255, 150)";
        }

        function updateBatteries() {
            let remainingGrams = totalConsumed;
            let overDailyLimit = totalConsumed > (MEAL_LIMIT * 3);

            for (let i = 0; i < 3; i++) {
                let fillDiv = document.getElementById(`fill-${i}`);
                let readoutDiv = document.getElementById(`readout-${i}`);
                
                // Calculate how many grams fall into this specific meal window
                let mealGrams = Math.min(remainingGrams, MEAL_LIMIT);
                
                // If we've blown past all 3 meals, the last battery takes the visual overload
                if (i === 2 && remainingGrams > MEAL_LIMIT) {
                    mealGrams = remainingGrams; 
                }

                // Update text
                readoutDiv.innerText = mealGrams + "g";

                // Calculate visual height (cap at 100% unless it's the final overflow)
                let fillPercentage = (mealGrams / MEAL_LIMIT) * 100;
                if (fillPercentage > 100 && i !== 2) fillPercentage = 100;
                
                fillDiv.style.height = Math.min(fillPercentage, 100) + "%";

                // Color logic: Green = Safe, Red = Overloaded
                if (mealGrams >= MEAL_LIMIT || overDailyLimit) {
                    fillDiv.style.backgroundColor = "rgb(255, 50, 50)";
                    readoutDiv.style.color = "rgb(255, 100, 100)";
                } else {
                    fillDiv.style.backgroundColor = "rgb(0, 200, 200)";
                    readoutDiv.style.color = "white";
                }

                // Subtract what this meal absorbed from the remaining total
                remainingGrams -= mealGrams;
                if (remainingGrams < 0) remainingGrams = 0;
            }

            // System Warning Text
            if (totalConsumed > 36) {
                document.getElementById('systemStatus').innerText = `LIVER OVERLOAD: +${totalConsumed - 36}g TOXIC SURPLUS`;
                document.getElementById('systemStatus').style.color = "rgb(255, 50, 50)";
            } else if (totalConsumed > 12) {
                document.getElementById('systemStatus').innerText = "CASCADING BUDGET FAILURE";
                document.getElementById('systemStatus').style.color = "rgb(255, 200, 0)";
            }
        }

        function copyDirectLink() {
            let directUrl = window.location.href;
            navigator.clipboard.writeText(directUrl).then(function() {
                alert("Direct link copied! We can now share this specific simulator.");
            }).catch(function(err) {
                console.error("Could not copy text: ", err);
            });
        }
    </script>
</body>
</html>
